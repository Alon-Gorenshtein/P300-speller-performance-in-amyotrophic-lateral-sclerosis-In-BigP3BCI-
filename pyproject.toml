[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bigp3-als-calibration"
version = "0.1.0"
description = "Reproducible validation of P300 calibration against online spelling performance in ALS."
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.9",
  "mne>=1.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "statsmodels>=0.14",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["slow: reruns a full validation pass"]

[tool.hatch.build.targets.wheel]
packages = ["src/bigp3_als"]
